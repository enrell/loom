[workspace]
resolver = "3"
members = ["crates/loom-plugin", "crates/loom-core", "crates/loom-cli", "crates/loom-mcp"]
exclude = ["prototypes", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/enrell/loom"
authors = ["Loom contributors"]

[workspace.dependencies]
loom-plugin = { path = "crates/loom-plugin" }
loom-core = { path = "crates/loom-core" }
loom-mcp = { path = "crates/loom-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
sha2 = "0.10"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
