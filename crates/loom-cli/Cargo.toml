[package]
name = "loom-cli"
description = "The `loom` command: every Loom operation, with --json output for scripts and agents."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[dependencies]
loom-core.workspace = true
loom-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints]
workspace = true
