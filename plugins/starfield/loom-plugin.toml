# Official Loom plugin — Starfield.
[plugin]
id = "github.com/enrell/loom/plugins/starfield"
name = "Starfield"
version = "0.1.0"
kind = "game"
description = "Game support for Starfield: detection, mod layout, load order, script extender and tools."
authors = ["Loom contributors"]
license = "MIT"
homepage = "https://github.com/enrell/loom/tree/main/plugins/starfield"

[game]
id = "starfield"
name = "Starfield"
nexus_domain = "starfield"
executables = [
  { id = "starfield", name = "Starfield", path = "Starfield.exe", default = true },
  { id = "sfse", name = "SFSE", path = "sfse_loader.exe", optional = true },
]

[game.detect]
steam = [1716740]
registry = [{ key = 'HKLM\SOFTWARE\WOW6432Node\Bethesda Softworks\Starfield', value = "installed path" }]
requires = ["Starfield.exe", "Data"]

[game.mods]
data_dir = "Data"
data_markers = ["*.esp", "*.esm", "meshes", "textures", "scripts", "interface", "sound", "music", "strings", "seq", "video", "shaders", "materials", "*.ba2", "*.esl", "sfse", "geometries"]
root_markers = ["sfse_loader.exe", "sfse_*.dll"]
fallback = "data"

[game.load_order]
format = "plugins-txt"
plugins_file = "%LOCALAPPDATA%/Starfield/Plugins.txt"
loadorder_file = "%LOCALAPPDATA%/Starfield/loadorder.txt"
extensions = ["esm", "esp", "esl"]
star_prefix = true
implicit = ["Starfield.esm", "Constellation.esm", "OldMars.esm", "BlueprintShips-Starfield.esm"]
light_extension = "esl"
max_plugins = 254
header = "tes4"

[[tools]]
id = "xtranslator"
name = "xTranslator"
description = "Translates plugin strings."
exe = ["xTranslator.exe"]
homepage = "https://www.nexusmods.com/skyrimspecialedition/mods/134"

[[tools]]
id = "sf1edit"
name = "SF1Edit"
description = "Plugin editor (xEdit)."
exe = ["SF1Edit.exe", "xEdit.exe"]
homepage = "https://www.nexusmods.com/starfield/mods/239"
args = ["-D:{game}/Data"]
agent_notes = """xEdit edits plugins directly. Run it inside the view so it sees the modded load order; save patches (e.g. a merged patch) and they land in the generated mod, which Loom keeps above the mods it patches."""
