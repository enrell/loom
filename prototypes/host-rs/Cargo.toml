[package]
name = "loom-proto-host"
version = "0.1.0"
edition = "2024"
publish = false
description = "Host-side helpers shared by the Tauri and egui prototypes: metrics, startup timing, nxm registration."

[dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation"] }
