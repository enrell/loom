[package]
name = "loom-tauri"
version = "0.1.0"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multiple webviews per window (the embedded Nexus view).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
loom-proto-host = { path = "../../host-rs" }

[profile.release]
codegen-units = 16
lto = false
strip = true
